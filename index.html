<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediGuía Enfermería</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#fff0f5,#ffe4ec,#ffd6e7);
      color:#7a1e3a;
    }

    header{
      background: linear-gradient(135deg,#ff4d88,#ff80ab,#ff99c2);
      color:white;
      padding:18px 25px;
      position: sticky;
      top:0;
      z-index:1000;
      box-shadow:0 6px 18px rgba(0,0,0,0.12);
    }

    nav{
      max-width:1200px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .logo{font-size:1.7rem;font-weight:bold;}
    .logo span{color:#ffe4ec;}

    .menu{display:flex;gap:12px;flex-wrap:wrap;}

    .menu button{
      background:rgba(255,255,255,0.2);
      border:none;
      color:white;
      padding:10px 16px;
      border-radius:999px;
      cursor:pointer;
      transition:0.25s;
      font-weight:bold;
    }

    .menu button:hover{background:white;color:#ff4d88;}

    .hero{
      max-width:1200px;
      margin:40px auto;
      padding:30px 20px;
      display:grid;
      grid-template-columns:1.2fr 0.8fr;
      gap:25px;
      align-items:center;
    }

    .hero-text{
      background:white;
      padding:35px;
      border-radius:28px;
      box-shadow:0 12px 30px rgba(255,77,136,0.15);
    }

    .hero-text h1{font-size:3rem;margin-bottom:15px;color:#ff4d88;}
    .hero-text p{font-size:1.08rem;line-height:1.7;margin-bottom:20px;color:#7a1e3a;}

    .hero-buttons{display:flex;gap:12px;flex-wrap:wrap;}

    .hero-buttons button{
      border:none;
      padding:13px 20px;
      border-radius:14px;
      cursor:pointer;
      font-weight:bold;
      font-size:1rem;
      transition:0.25s;
    }

    .primary{background:#ff4d88;color:white;}
    .primary:hover{background:#e6005c;}

    .secondary{background:#ffe4ec;color:#ff4d88;}
    .secondary:hover{background:#ffd6e7;}

    .hero-card{
      background:linear-gradient(135deg,#ffe4ec,#ffffff);
      padding:30px;
      border-radius:28px;
      box-shadow:0 12px 30px rgba(255,77,136,0.15);
      text-align:center;
    }

    .hero-card .emoji{font-size:5rem;margin-bottom:15px;}
    .hero-card h3{font-size:1.6rem;margin-bottom:10px;color:#ff4d88;}
    .hero-card p{color:#7a1e3a;line-height:1.6;}

    section{max-width:1200px;margin:0 auto 35px auto;padding:0 20px;}

    .section-box{
      background:white;
      border-radius:28px;
      padding:30px;
      box-shadow:0 12px 30px rgba(255,77,136,0.12);
    }

    .section-title{font-size:2rem;color:#ff4d88;margin-bottom:10px;}
    .section-subtitle{color:#7a1e3a;margin-bottom:22px;line-height:1.6;}

    .search-box{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}

    .search-box input{
      flex:1;min-width:240px;padding:14px 16px;
      border:2px solid #ffd6e7;border-radius:14px;font-size:1rem;outline:none;
    }

    .search-box input:focus{border-color:#ff4d88;}

    .search-box button{
      padding:14px 18px;border:none;border-radius:14px;
      background:#ff4d88;color:white;cursor:pointer;font-weight:bold;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:18px;
    }

    .card{
      background:linear-gradient(135deg,#fff0f5,#ffe4ec);
      border:1px solid #ffd6e7;border-radius:22px;padding:22px;transition:0.25s;
    }

    .card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(255,77,136,0.15);}

    .card h3{color:#ff4d88;margin-bottom:10px;}
    .card p{color:#7a1e3a;line-height:1.6;margin-bottom:15px;}

    .card button{
      background:#ffe4ec;color:#ff4d88;border:none;
      padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:bold;
    }

    .features{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:16px;
    }

    .feature{
      background:#fff0f5;border-left:6px solid #ff4d88;
      border-radius:18px;padding:20px;
    }

    .feature h4{margin-bottom:8px;color:#ff4d88;}
    .feature p{color:#7a1e3a;line-height:1.6;}

    .ai-box{
      background:linear-gradient(135deg,#ff4d88,#ff80ab);
      color:white;border-radius:28px;padding:30px;
    }

    .ai-box h2{margin-bottom:10px;font-size:2rem;}
    .ai-box p{line-height:1.7;margin-bottom:18px;color:#fff0f5;}

    .ai-box .mini{
      background:rgba(255,255,255,0.2);
      padding:16px;border-radius:18px;margin-top:10px;
    }

    footer{text-align:center;padding:30px 20px 50px;color:#7a1e3a;font-size:0.95rem;}

    .hidden{display:none;}

    #resultadoBusqueda{
      margin-top:18px;padding:18px;border-radius:18px;
      background:#fff0f5;border:1px solid #ffd6e7;color:#7a1e3a;line-height:1.7;
    }

    @media(max-width:900px){
      .hero{grid-template-columns:1fr;}
      .hero-text h1{font-size:2.3rem;}
    }
  </style>
</head>
<body>

</body>
</html>
