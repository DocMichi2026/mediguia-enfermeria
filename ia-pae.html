<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IA PAE - MediGuía</title>
 
<style>
body{
  font-family: Arial;
  background: linear-gradient(135deg,#fff1f2,#ffe4e6,#fecdd3);
  padding:20px;
  color:#7f1d1d;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

input{
  width:70%;
  padding:10px;
  border-radius:10px;
  border:1px solid #fda4af;
}

button{
  padding:10px 15px;
  background:#f43f5e;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#resultado{
  margin-top:20px;
  white-space:pre-line;
}
</style>

</head>
<body>
 
<div class="container">

<h1>🤖 IA de apoyo para PAE</h1>

<input type="text" id="patologia" placeholder="Ej: Absceso abdominal">
<button onclick="buscar()">Buscar</button>

<div id="estado"></div>
<div id="resultado"></div>

</div>

<script>
let baseDatos = [];

// Cargar JSON al abrir la página
async function cargarPatologias() {
  try {
    const res = await fetch("data/patologias.json");
    if (!res.ok) {
      throw new Error("No se pudo cargar data/patologias.json");
    }

    const data = await res.json();
    baseDatos = data.patologias || [];
    console.log("Base cargada:", baseDatos.length, "patologías");
  } catch (error) {
    console.error("Error al cargar patologías:", error);
    document.getElementById("estado").innerHTML =
      "Error al cargar la base de patologías.";
  }
}

cargarPatologias();

// Normalizar texto
function normalizarTexto(texto) {
  return (texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

// Buscar en la base local
function buscarEnBase(termino) {
  const terminoNormalizado = normalizarTexto(termino);

  return baseDatos.find((patologia) => {
    const nombre = normalizarTexto(patologia.nombre);
    const sinonimos = (patologia.sinonimos || []).map(normalizarTexto);

    return (
      nombre === terminoNormalizado ||
      sinonimos.includes(terminoNormalizado)
    );
  });
}

// Función principal del botón
function buscar() {
  const input = document.getElementById("patologia").value.trim();
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");

  if (!input) {
    estado.innerHTML = "Escribe una patología.";
    resultado.innerHTML = "";
    return;
  }

  estado.innerHTML = "Buscando...";
  resultado.innerHTML = "";

  const encontrada = buscarEnBase(input);

  if (encontrada) {
    estado.innerHTML = "Patología encontrada en MediGuía.";
    mostrarPatologia(encontrada);
  } else {
    estado.innerHTML = "Patología no encontrada. Usando IA...";
    usarIA(input);
  }
}

// Mostrar datos del JSON
function mostrarPatologia(patologia) {
  const resultado = document.getElementById("resultado");

  resultado.innerHTML = `
    <h2>${patologia.nombre}</h2>
    <p><strong>Categoría:</strong> ${patologia.categoria || "No especificada"}</p>
    <p><strong>Descripción breve:</strong> ${patologia.descripcion_breve || ""}</p>
    <p><strong>Definición:</strong> ${patologia.definicion || ""}</p>

    <h3>Signos y síntomas</h3>
    <ul>
      ${(patologia.signos_sintomas || []).map(item => `<li>${item}</li>`).join("")}
    </ul>

    <h3>Valoración de enfermería</h3>
    <ul>
      ${(patologia.valoracion_enfermeria || []).map(item => `<li>${item}</li>`).join("")}
    </ul>

    <h3>Diagnósticos NANDA sugeridos</h3>
    <ul>
      ${(patologia.diagnosticos_nanda_sugeridos || []).map(dx => `<li>${dx}</li>`).join("")}
    </ul>

    <h3>NOC sugeridos</h3>
    <ul>
      ${(patologia.noc_sugeridos || []).map(item => `<li>${item}</li>`).join("")}
    </ul>

    <h3>NIC sugeridos</h3>
    <ul>
      ${(patologia.nic_sugeridos || []).map(item => `<li>${item}</li>`).join("")}
    </ul>
  `;
}

// IA temporal
function usarIA(patologia) {
  const resultado = document.getElementById("resultado");

  resultado.innerHTML = `
    <h2>${patologia}</h2>
    <p>No está en la base local todavía.</p>
    <p>Aquí entrará la IA para investigar la patología y devolver la información necesaria para construir el PAE.</p>
  `;
}
</script>
</script>

</body>
</html>
